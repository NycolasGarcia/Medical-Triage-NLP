[project]
name = "medical-triage-nlp"
version = "0.1.0"
description = "Triagem automática de laudos médicos em texto: classificador NLP leve servido via API REST, com pipeline de CI/CD, orquestração de retreino e monitoramento."
authors = [
    { name = "Nycolas Garcia", email = "nycolasagrg.work@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlflow>=3.16.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "dvc>=3.67.1",
    "matplotlib>=3.11.1",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pandera>=0.33.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["T201", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
