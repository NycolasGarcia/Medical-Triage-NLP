stages:
  download:
    cmd: uv run python -m src.data.load
    deps:
      - src/data/load.py
    outs:
      - data/raw/medical_tc_labels.csv
      - data/raw/medical_tc_train.csv
      - data/raw/medical_tc_test.csv

  preprocess:
    cmd: uv run python -m src.data.prepare
    deps:
      - src/data/prepare.py
      - src/data/load.py
      - src/data/labels.py
      - src/data/dedupe.py
      - data/raw/medical_tc_labels.csv
      - data/raw/medical_tc_train.csv
      - data/raw/medical_tc_test.csv
    outs:
      - data/processed/deduped.csv

  split:
    cmd: uv run python -m src.data.split
    deps:
      - src/data/split.py
      - data/processed/deduped.csv
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
