name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --group training

      - run: uv run ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --group training

      # Sem remote acessível no runner: reconstrói os dados direto da fonte
      # canônica (GitHub, sem credencial) em vez de `dvc pull`.
      - run: uv run dvc repro

      - run: uv run pytest --cov=src --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --group training

      - run: uv run dvc repro

      # A imagem copia models/ no build — precisa existir os dois artefatos antes
      # (model.joblib para MODEL_BACKEND=sklearn, model.onnx+calibrador para
      # MODEL_BACKEND=onnx, caixa 6.6/ADR-0004).
      - run: uv run python -m src.models.train
      - run: uv run python -m src.optimization.onnx_export

      - run: docker build -t medical-triage-nlp:ci .
